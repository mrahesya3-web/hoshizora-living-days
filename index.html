<style>
:root{--ink:#26324a;--muted:#69758c;--pink:#f5b8cf;--pink2:#fff0f5;--blue:#b9dff3;--blue2:#edf8ff;--cream:#fffaf4;--card:#ffffff;--line:#e7eaf1;--green:#c8e9d5;--shadow:0 12px 32px #34415c12}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff5f8,#eff8ff 55%,#fffaf0);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 13px;background:#edf3fa;color:var(--ink);font-weight:650;transition:.15s}button:hover{transform:translateY(-1px);filter:brightness(.98)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:linear-gradient(135deg,#f3aeca,#c5e7fa)}.softpink{background:var(--pink2)}.softblue{background:var(--blue2)}.danger{background:#ffe7e7;color:#963f4c}.hidden{display:none!important}.app{max-width:1280px;margin:auto;padding:16px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#ffffffd9;border:1px solid #fff;border-radius:20px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:5;backdrop-filter:blur(12px)}.brand{font-size:1.15rem;font-weight:900;letter-spacing:.06em}.brand span{color:#d16f9a}.topmeta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{font-size:.83rem;background:#f4f6fb;padding:7px 10px;border-radius:999px;color:#4c5b73}.screen{margin-top:16px}.hero{background:linear-gradient(125deg,#fff,#fff3f8 48%,#edf8ff);border:1px solid white;border-radius:24px;padding:clamp(20px,4vw,44px);box-shadow:var(--shadow)}.hero h1{font-size:clamp(2rem,5vw,3.6rem);margin:0 0 8px;line-height:1.05}.hero p{max-width:760px;line-height:1.65;color:var(--muted)}.eyebrow{text-transform:uppercase;font-size:.76rem;letter-spacing:.16em;color:#bd6690;font-weight:800}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid #fff;border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:.86rem}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-weight:750;font-size:.92rem}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fcfdff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus{border-color:#d78eaf;box-shadow:0 0 0 3px #f9dce8}.options{display:flex;gap:8px;flex-wrap:wrap}.options button{border:1px solid var(--line);background:#fff}.options button.selected{background:#ffe6f0;border-color:#e7a0bc;box-shadow:inset 0 0 0 1px #e7a0bc}.traitgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.traitgrid button{font-size:.88rem}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,.85fr);gap:14px}.scene{min-height:260px;overflow:hidden;position:relative;background:linear-gradient(160deg,#d9effb,#fff2f6 55%,#fce5c7);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#ffffffa8 0 5%,transparent 6%),linear-gradient(180deg,transparent,#ffffffb8);pointer-events:none}.scene>*{position:relative}.scene .emoji{font-size:3.2rem;position:absolute;top:18px;left:22px}.scene h2{font-size:1.8rem;margin:0 0 5px}.scene p{margin:0;max-width:700px;line-height:1.5}.stat{margin:12px 0}.statrow{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:5px}.bar{height:8px;border-radius:99px;background:#edf0f5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#eaa6c2,#a9d9f2)}.quickstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.quick{background:#f8faff;border-radius:12px;padding:10px}.quick b{display:block;font-size:1rem}.quick small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1 1 125px}.log{display:flex;flex-direction:column;gap:9px;max-height:290px;overflow:auto}.logitem{padding:10px 12px;background:#fafbfe;border-radius:12px;border-left:3px solid #e6b3cb;font-size:.9rem;line-height:1.5}.location-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.loc{display:flex;gap:10px;text-align:left;align-items:center;padding:12px;background:#fbfcff;border:1px solid var(--line)}.loc .locicon{font-size:1.5rem}.loc small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.npcrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#fafbfe;margin:8px 0}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#ffe2ed,#dff3ff);display:grid;place-items:center;font-size:1.35rem;flex-shrink:0}.npcrow .grow{flex:1;min-width:0}.npcrow b{display:block}.npcrow small{color:var(--muted)}.chatbox{background:#fbfcff;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.6;white-space:pre-wrap;min-height:80px}.composer{display:flex;gap:8px;margin-top:10px}.composer input{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#29344b;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:20;max-width:90vw}.footer{padding:18px;text-align:center;color:var(--muted);font-size:.82rem}.modalback{position:fixed;inset:0;background:#17203666;display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(650px,100%);max-height:85vh;overflow:auto;background:white;border-radius:20px;padding:22px;box-shadow:0 24px 80px #18203955}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.notice{padding:12px;border-radius:12px;background:#fff8e8;color:#725a24;font-size:.88rem;line-height:1.5}.tag{display:inline-block;background:#f3f5fa;border-radius:999px;padding:4px 8px;font-size:.78rem;margin:2px}.divider{height:1px;background:var(--line);margin:14px 0}
@media(max-width:850px){.layout{grid-template-columns:1fr}.grid.two,.grid.three{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.topmeta{justify-content:flex-start}.quickstats{grid-template-columns:repeat(2,minmax(0,1fr))}.traitgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.scene{min-height:230px}.location-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.app{padding:9px}.card{padding:14px}.location-grid{grid-template-columns:1fr}.brand{font-size:1rem}.topbar{padding:12px}}
</style>

<body>
<div class="app">
<header class="topbar">
  <div class="brand">🌸 HOSHIZORA <span>Living Days</span></div>
  <div class="topmeta" id="topMeta"><span class="pill">Life Simulation RPG</span><span class="pill">AI Story Engine</span></div>
</header>
<main id="main" class="screen"></main>
<div class="footer">Hoshizora: Living Days · Playable Alpha · Progres tersimpan di browser ini · Narasi menggunakan AI</div>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);
const traits=['Rajin','Malas','Pemalu','Percaya diri','Jahil','Santai','Serius','Ambisius','Pendiam','Humoris','Pemberani','Penakut','Pemarah','Penyayang','Egois','Rendah hati','Kompetitif','Ceroboh','Romantis','Manipulatif'];
const skills=['Akademik','Olahraga','Musik','Seni','Menyanyi','Memasak','Komunikasi','Teknologi','Menari','Kerajinan'];
const districts=[
 {id:'hoshizora',name:'Distrik Hoshizora',icon:'🏫',desc:'Pusat kehidupan pelajar.',locations:[['school','Hoshizora High School','🏫','Sekolah, kelas, klub, OSIS'],['library','Perpustakaan Kota','📚','Belajar dan membaca'],['citypark','Taman Kota','🌳','Bersantai dan bertemu orang'],['conbini','Convenience Store','🏪','Makanan, minuman, kebutuhan'],['diner','Restoran Murah','🍜','Makan dengan harga terjangkau'],['busstop','Halte Bus','🚌','Perjalanan antarwilayah']]},
 {id:'seaside',name:'Distrik Seaside',icon:'🌊',desc:'Angin laut, aquarium, dan jalan tepi pantai.',locations:[['beach','Hoshizora Beach','🏖️','Berjalan dan menikmati laut'],['seasidepark','Seaside Park','🌅','Pemandangan matahari terbenam'],['aquarium','Aquarium','🐠','Wisata berbayar'],['harbor','Pelabuhan Kecil','⚓','Kapal dan pemancing'],['icecream','Toko Es Krim','🍦','Camilan dingin'],['seafood','Restoran Seafood','🐟','Makan dekat laut']]},
 {id:'central',name:'Distrik Central',icon:'🛍️',desc:'Pusat transportasi, hiburan, dan belanja.',locations:[['station','Hoshizora Station','🚉','Kereta dan perjalanan'],['mall','Hoshizora Mall','🛍️','Belanja dan bertemu orang'],['arcade','Arcade','🎮','Bermain game'],['cinema','Bioskop','🎬','Menonton film'],['bookstore','Toko Buku','📖','Buku dan alat tulis'],['cafe','Kafe','☕','Minum dan mengobrol'],['karaoke','Karaoke','🎤','Bernyanyi bersama']]},
 {id:'sakura',name:'Distrik Sakura',icon:'🌸',desc:'Kawasan keluarga, kuil, dan jalan yang tenang.',locations:[['sakurapark','Sakura Park','🌸','Taman dan sungai'],['shrine','Kuil Sakura','⛩️','Tempat tenang untuk berkunjung'],['bakery','Toko Roti','🥐','Roti segar'],['flower','Toko Bunga','💐','Bunga dan hadiah'],['residential','Permukiman Sakura','🏘️','Rumah-rumah penduduk']]},
 {id:'minato',name:'Distrik Minato',icon:'🏢',desc:'Distrik bisnis dengan rumah sakit dan kantor.',locations:[['hospital','Rumah Sakit','🏥','Layanan kesehatan'],['offices','Kawasan Perkantoran','🏢','Pekerja dan perusahaan'],['hotel','Hotel Minato','🏨','Hotel dan restoran'],['minatorest','Restoran Minato','🍱','Restoran kelas menengah']]},
 {id:'mountain',name:'Pegunungan',icon:'🌲',desc:'Hutan, danau, dan jalur hiking di luar pusat kota.',locations:[['forest','Hutan Hoshizora','🌲','Jalur alam'],['lake','Danau Hoshizora','🏞️','Pemandangan dan memancing'],['hiking','Jalur Hiking','🥾','Olahraga dan eksplorasi'],['inn','Penginapan Pegunungan','🏡','Menginap saat perjalanan']]}
];
const locIndex={};districts.forEach(d=>d.locations.forEach(l=>locIndex[l[0]]={id:l[0],name:l[1],icon:l[2],desc:l[3],district:d.id,districtName:d.name}));
const defaultNPCs=[
 {id:'rika',name:'Rika Sato',age:16,gender:'Perempuan',role:'Teman sekelas',traits:['Ramah','Ceria','Penasaran'],location:'school',known:false,rel:0,trust:0,likes:[],memory:[],emoji:'🌷',bio:'Siswi yang mudah menyapa orang, tetapi belum tentu langsung menceritakan hal pribadi.'},
 {id:'haruto',name:'Haruto Fujii',age:16,gender:'Laki-laki',role:'Siswa kelas 1',traits:['Kompetitif','Aktif','Terus terang'],location:'school',known:false,rel:0,trust:0,likes:[],memory:[],emoji:'⚽',bio:'Suka olahraga dan senang menantang teman untuk berkompetisi.'},
 {id:'mei',name:'Mei Nakamura',age:17,gender:'Perempuan',role:'Anggota OSIS',traits:['Serius','Teratur','Bertanggung jawab'],location:'school',known:false,rel:0,trust:0,likes:[],memory:[],emoji:'📋',bio:'Membantu mengurus kegiatan sekolah. Ia menghargai orang yang menepati janji.'},
 {id:'teacher',name:'Fujimoto Reina',age:32,gender:'Perempuan',role:'Wali kelas',traits:['Tegas','Perhatian','Teliti'],location:'school',known:false,rel:0,trust:0,likes:[],memory:[],emoji:'🍎',bio:'Guru yang memperhatikan kedisiplinan dan perkembangan siswa.'},
 {id:'shopkeeper',name:'Tanaka-san',age:48,gender:'Laki-laki',role:'Penjaga convenience store',traits:['Praktis','Ramah','Pekerja keras'],location:'conbini',known:false,rel:0,trust:0,likes:[],memory:[],emoji:'🏪',bio:'Penjaga toko yang mengenali pelanggan tetap.'},
 {id:'barista',name:'Yui Kondo',age:20,gender:'Perempuan',role:'Barista',traits:['Tenang','Kreatif','Observan'],location:'cafe',known:false,rel:0,trust:0,likes:[],memory:[],emoji:'☕',bio:'Barista yang suka membuat latte art dan memperhatikan pelanggan.'},
 {id:'guard',name:'Sakai',age:56,gender:'Laki-laki',role:'Satpam sekolah',traits:['Waspada','Disiplin','Adil'],location:'school',known:false,rel:0,trust:0,likes:[],memory:[],emoji:'🛡️',bio:'Menjaga ketertiban dan gerbang sekolah.'}
];
let game=null, actionBusy=false;
const initialState=()=>({version:1,player:null,day:1,date:{year:2026,month:4,day:6},minutes:6*60+30,location:'home',money:0,allowance:0,stats:{academic:25,athletic:25,social:25,charm:25,confidence:25,discipline:25,energy:90,stress:5},hunger:10,inventory:['Tas sekolah','Ponsel','Buku catatan'],relationships:{},npcs:JSON.parse(JSON.stringify(defaultNPCs)),events:[],log:[],job:null,schoolAttendance:0,flags:{},ai:{enabled:true,endpoint:'/api/turn'},worldSeed:Math.random().toString(36).slice(2,10)});
function save(){if(!game)return;localStorage.setItem('hoshizora_save_v1',JSON.stringify(game));}
function load(){try{const s=localStorage.getItem('hoshizora_save_v1');if(s){game=JSON.parse(s);return true}}catch(e){}return false}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function timeText(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dateText(){const d=new Date(game.date.year,game.date.month-1,game.date.day);return d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function addLog(text,type='info'){game.log.unshift({time:timeText(game.minutes),day:game.day,text,type});game.log=game.log.slice(0,80);save()}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,n))}
function statLabel(k){return ({academic:'Akademik',athletic:'Olahraga',social:'Sosial',charm:'Pesona',confidence:'Kepercayaan diri',discipline:'Disiplin',energy:'Energi',stress:'Stres'})[k]||k}
function locName(id){return locIndex[id]?.name|| (id==='home'?'Rumah':id==='street'?'Jalan Hoshizora':id)}
function weekday(){return new Date(game.date.year,game.date.month-1,game.date.day).getDay()}
function schoolDay(){return weekday()>=1&&weekday()<=5}
function atSchoolHours(){return schoolDay()&&game.minutes>=480&&game.minutes<900}
function renderStart(){
 $('#topMeta').innerHTML='<span class="pill">Life Simulation RPG</span><span class="pill">AI Story Engine</span>';
 $('#main').innerHTML=`<section class="hero"><div class="eyebrow">A living world · Your choices matter</div><h1>HOSHIZORA<br><span style="color:#d16f9a">Living Days</span></h1><p>Jalani kehidupanmu di kota pesisir Jepang yang terus berkembang. Bangun pertemanan, belajar, bekerja, menjelajah, jatuh cinta, membuat kesalahan, dan tentukan sendiri masa depanmu.</p><div class="actions"><button class="primary" onclick="newGame()">🌸 New Game</button><button onclick="continueGame()">▶ Continue</button><button onclick="openSettings()">⚙ Pengaturan & AI</button><button onclick="showHelp()">❔ Panduan</button></div></section><div class="grid three" style="margin-top:14px"><div class="card"><h3>🗺️ Dunia terbuka</h3><p class="muted">Enam distrik, banyak lokasi, dan aktivitas yang berbeda menurut waktu.</p></div><div class="card"><h3>👥 NPC yang berkembang</h3><p class="muted">Karakter memiliki kepribadian, rutinitas, hubungan, dan ingatan.</p></div><div class="card"><h3>💾 Persistent save</h3><p class="muted">Progres disimpan di browser ini. Cerita dan respons tindakan diproses oleh AI.</p></div></div><p class="small muted" style="margin:14px 4px">AI selalu aktif. Jalankan game melalui server dan atur API key satu kali pada environment server. Jika AI tidak tersedia, tindakan akan berhenti dengan pesan error—tidak ada simulasi lokal.</p>`;
}
function newGame(){
 const old=game; game=initialState();
 $('#main').innerHTML=`<div class="hero"><div class="eyebrow">Step 1 of 1 · Character creation</div><h1>Buat karaktermu</h1><p>Identitasmu adalah awal dari kehidupan baru. Tidak ada protagonis yang ditentukan untukmu dan tidak ada romance yang dijamin.</p>
 <div class="grid two"><div><div class="field"><label for="charName">Nama karakter</label><input id="charName" maxlength="40" placeholder="Nama yang kamu pilih" autocomplete="off"></div>
 <div class="field"><label>Gender</label><div class="options" id="genderOptions"><button type="button" data-v="Laki-laki" class="selected" onclick="pickOne('genderOptions',this)">Laki-laki</button><button type="button" data-v="Perempuan" onclick="pickOne('genderOptions',this)">Perempuan</button></div></div>
 <div class="field"><label>Umur dan kelas</label><div class="options" id="ageOptions"><button type="button" data-v="16" class="selected" onclick="pickOne('ageOptions',this)">16 · Kelas 1</button><button type="button" data-v="17" onclick="pickOne('ageOptions',this)">17 · Kelas 2</button><button type="button" data-v="18" onclick="pickOne('ageOptions',this)">18 · Kelas 3</button></div></div>
 <div class="field"><label>Ekonomi keluarga</label><div class="options" id="econOptions"><button type="button" data-v="Bawah" onclick="pickOne('econOptions',this)">Bawah</button><button type="button" data-v="Menengah" class="selected" onclick="pickOne('econOptions',this)">Menengah</button><button type="button" data-v="Atas" onclick="pickOne('econOptions',this)">Atas</button></div></div></div>
 <div><div class="field"><label>Sifat karakter <span class="muted">(maksimal 3)</span></label><div class="traitgrid" id="traitOptions">${traits.map(t=>`<button type="button" data-v="${t}" onclick="toggleTrait(this)">${t}</button>`).join('')}</div><small id="traitCount" class="muted">0/3 dipilih</small></div>
 <div class="field"><label>Kemampuan utama <span class="muted">(pilih 1)</span></label><div class="traitgrid" id="skillOptions">${skills.map((s,i)=>`<button type="button" data-v="${s}" ${i===0?'class="selected"':''} onclick="pickOne('skillOptions',this)">${s}</button>`).join('')}</div></div></div></div>
 <div class="notice">Ekonomi keluarga memengaruhi sumber daya awal, tetapi tidak menentukan kebahagiaan keluarga. Sifat memengaruhi kecenderungan, bukan mengunci tindakanmu.</div><div class="actions" style="margin-top:16px"><button onclick="renderStart()">Batal</button><button class="primary" onclick="createCharacter()">✨ Mulai kehidupan</button></div></div>`;
}
function pickOne(id,el){document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function toggleTrait(el){const selected=[...document.querySelectorAll('#traitOptions .selected')];if(el.classList.contains('selected'))el.classList.remove('selected');else if(selected.length<3)el.classList.add('selected');else toast('Maksimal 3 sifat.');$('#traitCount').textContent=document.querySelectorAll('#traitOptions .selected').length+'/3 dipilih'}
function selectedVal(id){return document.querySelector('#'+id+' .selected')?.dataset.v}
function createCharacter(){
 const name=$('#charName').value.trim();if(!name){toast('Masukkan nama karaktermu terlebih dahulu.');$('#charName').focus();return}
 const age=Number(selectedVal('ageOptions')||16),econ=selectedVal('econOptions')||'Menengah',selectedTraits=[...document.querySelectorAll('#traitOptions .selected')].map(b=>b.dataset.v),skill=selectedVal('skillOptions')||'Akademik';
 game.player={name,gender:selectedVal('genderOptions')||'Laki-laki',age,grade:age-15,economy:econ,traits:selectedTraits,skill};
 const funds={Bawah:1800,Menengah:5000,Atas:15000};game.money=funds[econ];game.allowance={Bawah:500,Menengah:1500,Atas:5000}[econ];
 game.stats.academic=skill==='Akademik'?40:25;game.stats.athletic=skill==='Olahraga'?40:25;game.stats.charm=skill==='Menyanyi'||skill==='Menari'||skill==='Seni'?32:25;game.stats.social=skill==='Komunikasi'?40:25;
 if(selectedTraits.includes('Rajin'))game.stats.discipline+=8;if(selectedTraits.includes('Malas'))game.stats.discipline-=8;if(selectedTraits.includes('Percaya diri'))game.stats.confidence+=8;if(selectedTraits.includes('Pemalu'))game.stats.confidence-=5;if(selectedTraits.includes('Humoris'))game.stats.social+=5;
 game.stats.energy=90;game.location='home';game.minutes=390;game.day=1;
 game.npcs.forEach(n=>{n.known=false;n.location=n.location||'school';game.relationships[n.id]={stage:'Belum dikenal',affection:0,trust:0}});
 addLog(`Kehidupan ${name} dimulai. Kamu berusia ${age} tahun dan berada di kelas ${game.player.grade}.`);addLog(`Kondisi awal: ekonomi keluarga ${econ.toLowerCase()}, kemampuan utama ${skill}.`);
 save();renderGame();toast('Karakter berhasil dibuat. Selamat datang di Hoshizora!');
}
function continueGame(){if(load()&&game.player){renderGame();toast('Progres berhasil dimuat.')}else toast('Belum ada save. Pilih New Game untuk memulai.')}
function getCurrentNPCs(){return game.npcs.filter(n=>n.location===game.location)}
function statusPanel(){const p=game.player;return `<div class="card"><h2>👤 ${esc(p.name)}</h2><div class="muted small">${p.gender} · ${p.age} tahun · Kelas ${p.grade}</div><div style="margin-top:10px"><span class="tag">${esc(p.economy)}</span><span class="tag">${esc(p.skill)}</span>${p.traits.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="divider"></div><div class="quickstats"><div class="quick"><small>💴 Uang</small><b>¥${game.money.toLocaleString('id-ID')}</b></div><div class="quick"><small>⚡ Energi</small><b>${game.stats.energy}/100</b></div><div class="quick"><small>🍙 Lapar</small><b>${game.hunger}/100</b></div><div class="quick"><small>🌧️ Stres</small><b>${game.stats.stress}/100</b></div></div>${Object.entries(game.stats).map(([k,v])=>`<div class="stat"><div class="statrow"><span>${statLabel(k)}</span><b>${v}/100</b></div><div class="bar"><span style="width:${v}%"></span></div></div>`).join('')}<div class="actions"><button onclick="openStatus()">📊 Detail</button><button onclick="openInventory()">🎒 Inventaris</button><button onclick="openRelations()">❤️ Hubungan</button></div></div>`}
function renderGame(){
 if(!game?.player){renderStart();return}
 const loc=locIndex[game.location]||{name:game.location==='home'?'Rumah':game.location==='street'?'Jalan Hoshizora':game.location,icon:game.location==='home'?'🏠':'🚶',desc:'Kamu berada di lokasi ini.'};
 $('#topMeta').innerHTML=`<span class="pill">📅 ${dateText()}</span><span class="pill">🕒 ${timeText(game.minutes)}</span><span class="pill">💴 ¥${game.money.toLocaleString('id-ID')}</span><button onclick="save();toast('Game disimpan.')">💾 Save</button><button onclick="openSettings()">⚙</button>`;
 const schoolNotice=atSchoolHours()&&game.location!=='school'&&game.location!=='home'?'<div class="notice">Jam sekolah sedang berlangsung. Jika kamu seharusnya masuk kelas, ketidakhadiran bisa berdampak pada catatan sekolah.</div>':'';
 const available=game.npcs.filter(n=>n.location===game.location);
 $('#main').innerHTML=`<div class="layout"><div class="grid" style="align-content:start">
 <section class="scene"><div class="emoji">${loc.icon}</div><div class="eyebrow">${esc(loc.districtName||'Kehidupan pribadi')}</div><h2>${esc(loc.name)}</h2><p>${esc(loc.desc||'')}</p><p class="small" style="margin-top:10px">📅 ${dateText()} · ${timeText(game.minutes)} · ${weatherText()}</p></section>
 <div class="card"><h2>🧭 Apa yang ingin kamu lakukan?</h2><div class="actions"><button class="softpink" onclick="openExplore()">🗺️ Jelajahi</button><button class="softblue" onclick="openActivity()">✨ Aktivitas</button><button onclick="openSchedule()">📅 Jadwal</button><button onclick="openJobs()">💼 Pekerjaan</button><button onclick="openSleep()">🌙 Tidur</button></div><div class="field"><label>Tindakan bebas</label><div class="composer"><input id="freeAction" placeholder="Contoh: Aku membeli roti lalu duduk di taman..." onkeydown="if(event.key==='Enter')freeAction()"><button class="primary" onclick="freeAction()">Kirim</button></div><small class="muted">Tindakan bebas dan percakapan diproses oleh AI. AI harus terhubung untuk menjalankan tindakan.</small></div>${schoolNotice}</div>
 <div class="card"><h2>📍 Lokasi dan orang di sekitar</h2>${available.length?available.map(n=>`<div class="npcrow"><div class="avatar">${n.emoji}</div><div class="grow"><b>${esc(n.known?n.name:'Seseorang')}</b><small>${esc(n.known?n.role:'Kamu belum mengenalnya')}</small></div><button onclick="interact('${n.id}')">Sapa</button></div>`).join(''):'<p class="muted">Tidak ada karakter yang jelas terlihat di sekitarmu saat ini. Kamu bisa menjelajah, beraktivitas, atau melewati waktu.</p>'}</div>
 </div><div class="grid" style="align-content:start">${statusPanel()}<div class="card"><h2>📖 Catatan kejadian</h2><div class="log">${game.log.slice(0,7).map(e=>`<div class="logitem"><b>Hari ${e.day} · ${e.time}</b><br>${esc(e.text)}</div>`).join('')}</div><div class="actions" style="margin-top:10px"><button onclick="openJournal()">Buka jurnal lengkap</button></div></div><div class="card"><h3>🌱 Tujuan hidupmu</h3><p class="muted small">Tidak ada misi utama yang wajib. Kamu bebas membangun kehidupanmu sendiri.</p><div class="actions"><button onclick="openRelations()">Kenali orang</button><button onclick="openActivity()">Kembangkan diri</button></div></div></div></div>`;
 save();
}
function weatherText(){const w=['cerah','berawan','sejuk','mendung'];return w[(game.day+Math.floor(game.minutes/360))%w.length]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function advance(mins,reason='Waktu berlalu'){
 if(!Number.isFinite(mins)||mins<0)return;
 const old=game.minutes,total=old+mins,days=Math.floor(total/1440);game.minutes=total%1440;
 for(let i=0;i<days;i++){game.day++;game.date.day++;const d=new Date(game.date.year,game.date.month-1,game.date.day);game.date={year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()};game.money+=game.allowance;addLog(`Hari baru dimulai. Uang saku ¥${game.allowance.toLocaleString('id-ID')} diterima.`)}
 if(mins>=30){game.stats.energy=clamp(game.stats.energy-Math.max(1,Math.floor(mins/90)));game.hunger=clamp(game.hunger+Math.max(1,Math.floor(mins/60)))}
 // NPC routines move without revealing private information.
 game.npcs.forEach(n=>{if(n.id==='teacher'||n.id==='rika'||n.id==='haruto'||n.id==='mei'){if(schoolDay()&&game.minutes>=480&&game.minutes<900)n.location='school';else if(game.minutes>=900&&game.minutes<1080)n.location=['station','cafe','citypark'][game.day%3];else n.location=['home','library','cafe'][((game.day+n.id.length)%3)]}else if(n.id==='shopkeeper')n.location='conbini';else if(n.id==='barista')n.location='cafe';});
 if(atSchoolHours()&&old<480&&game.minutes>=480&&game.location!=='school'&&game.location!=='home'){game.stats.stress=clamp(game.stats.stress+3);addLog('Jam sekolah dimulai. Kamu belum berada di sekolah.')}
 if(game.hunger>80){game.stats.energy=clamp(game.stats.energy-3);game.stats.stress=clamp(game.stats.stress+2)}
 if(game.stats.energy<15){game.stats.stress=clamp(game.stats.stress+2)}
 addLog(`${reason} (${mins} menit).`);save();
}
function actionResult(text,mins=30,opts={}){if(actionBusy)return;actionBusy=true;advance(mins,text);if(opts.money!==undefined)game.money+=opts.money;if(opts.stat){for(const [k,v] of Object.entries(opts.stat))game.stats[k]=clamp((game.stats[k]||0)+v)}if(opts.hunger!==undefined)game.hunger=clamp(game.hunger+opts.hunger);if(opts.inventoryAdd)game.inventory.push(opts.inventoryAdd);if(opts.inventoryRemove){const i=game.inventory.indexOf(opts.inventoryRemove);if(i>=0)game.inventory.splice(i,1)}if(opts.event)addLog(opts.event,'event');save();renderGame();actionBusy=false}
function openModal(title,body){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button onclick="closeModal()">✕</button></div><div class="divider"></div>${body}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function openExplore(){
 const body=`<p class="muted">Pilih tujuan. Perjalanan memerlukan waktu dan dapat memengaruhi energi.</p>${districts.map(d=>`<h3 style="margin-top:18px">${d.icon} ${d.name}</h3><p class="muted small">${d.desc}</p><div class="location-grid">${d.locations.map(l=>`<button class="loc" onclick="travel('${l[0]}')"><span class="locicon">${l[2]}</span><span><b>${l[1]}</b><small>${l[3]}</small></span></button>`).join('')}</div>`).join('')}`;
 openModal('🗺️ Jelajahi Hoshizora',body)
}
function travel(id){
 const target=locIndex[id];if(!target)return;const current=locIndex[game.location];let mins=15;if(current&&current.district!==target.district)mins=45;else if(!current)mins=25;if(game.location==='home')mins=20;if(id==='school'&&atSchoolHours())mins=15;
 closeModal();game.location=id;
 const possible=game.npcs.filter(n=>n.location===id&&!n.known);
 if(possible.length){const n=possible[(game.day+game.minutes)%possible.length];if(Math.random()<.38){n.known=true;game.relationships[n.id].stage='Kenalan';addLog(`Kamu melihat ${n.name} di ${target.name}. Kalian belum banyak mengenal satu sama lain.`)}}
 actionResult(`Perjalanan ke ${target.name}`,mins); 
}
function openActivity(){
 const activities=[
 ['Belajar mandiri','Mempelajari materi sekolah selama 1 jam.',60, {academic:3,discipline:2,energy:-8,stress:1}],
 ['Membaca buku','Membaca untuk menambah wawasan.',30,{academic:2,stress:-2,energy:-3}],
 ['Olahraga ringan','Bergerak dan melatih kebugaran.',30,{athletic:3,energy:-8,stress:-2}],
 ['Berlatih kemampuan utama',`Berlatih ${game.player.skill.toLowerCase()} dengan serius.`,60,skillStat()],
 ['Bersantai','Mengambil jeda dan menenangkan pikiran.',30,{stress:-6,energy:5}],
 ['Merapikan diri','Mandi, merapikan rambut, dan menjaga penampilan.',30,{charm:2,stress:-1,energy:-2}],
 ['Makan dari inventaris','Mengonsumsi bekal sederhana jika tersedia.',20,{energy:4,stress:-1,hunger:-30}]
 ];
 openModal('✨ Aktivitas',`<p class="muted">Aktivitas menghabiskan waktu dan dapat memengaruhi statistik.</p>${activities.map((a,i)=>`<div class="npcrow"><div class="grow"><b>${a[0]}</b><small>${a[1]} · ${a[2]} menit</small></div><button onclick="doActivity(${i})">Lakukan</button></div>`).join('')}`)
}
function skillStat(){const s=game.player.skill;const k=s==='Akademik'?'academic':['Olahraga'].includes(s)?'athletic':['Musik','Menyanyi','Seni','Menari','Kerajinan'].includes(s)?'charm':s==='Komunikasi'?'social':'discipline';return {[k]:4,energy:-9,stress:-1}}
function doActivity(i){
 const acts=[['Belajar mandiri',60,{academic:3,discipline:2,energy:-8,stress:1}],['Membaca buku',30,{academic:2,stress:-2,energy:-3}],['Olahraga ringan',30,{athletic:3,energy:-8,stress:-2}],['Berlatih kemampuan utama',60,skillStat()],['Bersantai',30,{stress:-6,energy:5}],['Merapikan diri',30,{charm:2,stress:-1,energy:-2}],['Makan dari inventaris',20,{energy:4,stress:-1,hunger:-30}]];
 const a=acts[i];if(!a)return;if(i===6){const idx=game.inventory.findIndex(x=>/bekal|roti|makanan/i.test(x));if(idx<0){toast('Kamu tidak memiliki makanan di inventaris.');return}game.inventory.splice(idx,1)}
 closeModal();actionResult(a[0],a[1],{stat:a[2],hunger:a[2].hunger||0});
}
function interact(id){
 const n=game.npcs.find(n=>n.id===id);if(!n)return;const known=n.known;
 openModal(`${n.emoji} ${known?esc(n.name):'Seseorang'}`,`<div class="npcrow"><div class="avatar">${n.emoji}</div><div class="grow"><b>${known?esc(n.name):'Belum dikenal'}</b><small>${known?esc(n.role):'Kamu belum tahu siapa dia.'}</small></div></div><p>${known?esc(n.bio):'Kamu melihat seseorang di dekatmu. Kamu belum mengetahui namanya atau kepribadiannya.'}</p><div class="actions"><button class="primary" onclick="talk('${id}','salam')">Sapa</button><button onclick="talk('${id}','smalltalk')">Mulai percakapan</button><button onclick="talk('${id}','observe')">Amati sebentar</button><button onclick="talk('${id}','leave')">Biarkan saja</button></div><div class="field"><label>Ucapan atau tindakan bebas</label><div class="composer"><input id="npcFree" placeholder="Ketik apa yang ingin kamu katakan..." onkeydown="if(event.key==='Enter')talkFree('${id}')"><button onclick="talkFree('${id}')">Kirim</button></div></div>`)
}
async function talk(id,kind){
 const n=game.npcs.find(n=>n.id===id);if(!n)return;
 const prompts={salam:`Sapa ${n.name} secara wajar dan lanjutkan interaksi sebagai dunia hidup.`,smalltalk:`Mulai percakapan ringan dengan ${n.name}.`,observe:`Amati ${n.name} dari jarak wajar tanpa mengasumsikan informasi yang belum diketahui.`,leave:`Akhiri interaksi dengan ${n.name} dan lanjutkan aktivitas tanpa mengganggunya.`};
 closeModal();await processFreeText(prompts[kind]||prompts.salam,id)
}
async function talkFree(id){const input=$('#npcFree');if(!input)return;const text=input.value.trim();if(!text)return;closeModal();await processFreeText(text,id)}
async function freeAction(){const input=$('#freeAction');const text=input.value.trim();if(!text)return;input.value='';await processFreeText(text,null)}
async function processFreeText(text,npcId){
 if(actionBusy)return;actionBusy=true;toast('AI sedang memproses tindakanmu…');
 try{const res=await fetchAI(text,npcId);if(!res||!res.narration)throw new Error('Respons AI tidak valid');applyAIResult(res,text,npcId)}
 catch(e){console.error(e);toast('AI gagal merespons. Periksa koneksi server dan konfigurasi API key, lalu coba lagi.');addLog('Tindakan belum dijalankan karena AI tidak tersedia. Tidak ada perubahan waktu atau status.','error')}
 finally{actionBusy=false}
}
async function fetchAI(text,npcId){
 const r=await fetch(game.ai.endpoint||'/api/turn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:text,player:game.player,world:{day:game.day,date:game.date,time:timeText(game.minutes),location:game.location,money:game.money,stats:game.stats,hunger:game.hunger},npcs:game.npcs.filter(n=>n.known||n.id===npcId).map(n=>({id:n.id,name:n.name,role:n.role,traits:n.traits,relationship:game.relationships[n.id],memory:n.memory.slice(-5)})),recentEvents:game.log.slice(0,8),npcId})});
 if(!r.ok)throw new Error('AI backend error');return await r.json()
}
function applyAIResult(r,text,npcId){
 const mins=Math.max(0,Math.min(240,Number(r.minutes)||30));closeModal();
 if(r.moneyChange&&game.money+Number(r.moneyChange)<0){toast('AI mengusulkan transaksi yang tidak dapat dibayar. Tindakan dibatalkan.');return}
 if(r.moneyChange)game.money+=Number(r.moneyChange);
 if(r.statChanges)for(const [k,v] of Object.entries(r.statChanges))if(k in game.stats)game.stats[k]=clamp(game.stats[k]+Number(v));
 if(r.location&&locIndex[r.location])game.location=r.location;
 advance(mins,`Tindakan: ${text}`);
 if(r.narration)addLog(r.narration,'event');
 if(r.npcResponse)addLog(r.npcResponse,'event');
 if(r.eventTitle)addLog(`Event: ${r.eventTitle}${r.choices?.length?' — '+r.choices.join(' / '):''}`,'event');
 save();renderGame()
}
function openSleep(){openModal('🌙 Istirahat dan tidur',`<p>Kamu berada di ${esc(locName(game.location))}. Pilih berapa lama kamu ingin beristirahat. Waktu akan berjalan dan dunia tetap bergerak.</p><div class="actions">${[30,60,120,240,360,480,600].map(m=>`<button onclick="sleepFor(${m})">${m<60?m+' menit':m/60+' jam'}</button>`).join('')}</div><div class="field"><label>Durasi khusus (menit)</label><div class="composer"><input id="customSleep" type="number" min="1" max="960" placeholder="Misalnya 420"><button onclick="customSleep()">Tidur</button></div></div>`)}
function sleepFor(m){closeModal();actionResult(`Kamu tidur/beristirahat selama ${m<60?m+' menit':m/60+' jam'}`,m,{stat:{energy:Math.min(100,Math.floor(m/10)),stress:-Math.min(20,Math.floor(m/30))},hunger:Math.floor(m/60)});game.stats.energy=clamp(game.stats.energy+Math.floor(m/8));save();renderGame()}
function customSleep(){const n=Number($('#customSleep').value);if(!n||n<1||n>960){toast('Masukkan durasi 1–960 menit.');return}sleepFor(n)}
function openSchedule(){const items=[['08.00–10.00','Pelajaran pertama'],['10.00–10.30','Istirahat pertama'],['10.30–12.30','Pelajaran berikutnya'],['12.30–13.00','Istirahat makan siang'],['13.00–15.00','Pelajaran terakhir']];openModal('📅 Jadwal sekolah',`<p>${schoolDay()?'Hari sekolah':'Hari libur sekolah'} · ${dateText()}</p>${items.map(i=>`<div class="npcrow"><div class="grow"><b>${i[0]}</b><small>${i[1]}</small></div></div>`).join('')}<p class="muted small">Jadwal standar berlaku Senin–Jumat. Klub, ujian, dan event khusus dapat mengubah jadwal.</p><button class="primary" onclick="closeModal()">Selesai</button>`)}
function openJobs(){openModal('💼 Pekerjaan paruh waktu',`<p class="muted">Kamu boleh mencari pekerjaan atau tetap fokus pada kehidupan lain. Pekerjaan memiliki jam, upah, dan tanggung jawab.</p><div class="npcrow"><div class="avatar">🏪</div><div class="grow"><b>Convenience store</b><small>Shift percobaan · 3 jam · upah ¥3.300</small></div><button onclick="workShift('Convenience store',3300,180)">Ambil shift</button></div><div class="npcrow"><div class="avatar">☕</div><div class="grow"><b>Kafe</b><small>Shift bantuan · 2 jam · upah ¥2.200</small></div><button onclick="workShift('Kafe',2200,120)">Ambil shift</button></div><div class="npcrow"><div class="avatar">🥐</div><div class="grow"><b>Bakery</b><small>Shift pagi · 2 jam · upah ¥2.400</small></div><button onclick="workShift('Bakery',2400,120)">Ambil shift</button></div><div class="notice">Alpha: shift ini adalah simulasi untuk menguji ekonomi, bukan lamaran kerja permanen. Sistem kontrak, usia minimum, jadwal dan wawancara akan dikembangkan berikutnya.</div>`)}
function workShift(name,pay,mins){closeModal();if(game.stats.energy<15){toast('Energi terlalu rendah untuk menjalani shift dengan aman.');return}actionResult(`Kamu menjalani shift simulasi di ${name} selama ${mins/60} jam.`,mins,{money:pay,stat:{discipline:2,social:1,energy:-Math.floor(mins/15),stress:2},event:`Upah ¥${pay.toLocaleString('id-ID')} diterima dari shift simulasi.`})}
function openStatus(){openModal('📊 Status karakter',`<p><b>${esc(game.player.name)}</b> · ${game.player.age} tahun · Kelas ${game.player.grade}</p><p>Ekonomi keluarga: ${game.player.economy}<br>Kemampuan utama: ${game.player.skill}<br>Sifat: ${game.player.traits.join(', ')||'Belum dipilih'}</p><div class="divider"></div>${Object.entries(game.stats).map(([k,v])=>`<div class="stat"><div class="statrow"><span>${statLabel(k)}</span><b>${v}/100</b></div><div class="bar"><span style="width:${v}%"></span></div></div>`).join('')}<p>Uang pribadi: ¥${game.money.toLocaleString('id-ID')}<br>Uang saku harian: ¥${game.allowance.toLocaleString('id-ID')}<br>Rasa lapar: ${game.hunger}/100</p>`)}
function openInventory(){openModal('🎒 Inventaris',`<p>Barang yang kamu bawa:</p>${game.inventory.length?game.inventory.map(x=>`<div class="npcrow"><span class="avatar">🎒</span><div class="grow"><b>${esc(x)}</b></div></div>`).join(''):'<p class="muted">Inventaris kosong.</p>'}<button onclick="closeModal()">Tutup</button>`)}
function openRelations(){const known=game.npcs.filter(n=>n.known);openModal('❤️ Hubungan',`${known.length?known.map(n=>{const r=game.relationships[n.id]||{};return `<div class="npcrow"><div class="avatar">${n.emoji}</div><div class="grow"><b>${esc(n.name)}</b><small>${esc(n.role)} · ${esc(r.stage||'Kenalan')}</small></div><span class="tag">Kedekatan ${r.affection||0}</span></div>`}).join(''):'<p>Kamu belum mengenal NPC mana pun. Temui orang di lokasi yang kamu kunjungi untuk mulai membangun hubungan.</p>'}<p class="muted small">Daftar ini hanya menampilkan orang yang sudah kamu kenal. Kamu tidak otomatis mengetahui hubungan atau rahasia mereka.</p>`)}
function openJournal(){openModal('📖 Jurnal kejadian',`<div class="log">${game.log.map(e=>`<div class="logitem"><b>Hari ${e.day} · ${e.time}</b><br>${esc(e.text)}</div>`).join('')}</div>`)}
function openSettings(){openModal('⚙ Pengaturan',`<h3>AI Story Engine · Selalu aktif</h3><p class="muted">Semua tindakan naratif dan percakapan diproses oleh AI melalui backend. Mode lokal tidak tersedia. API key disimpan di server, bukan di browser.</p><div class="notice" id="aiHealth">Memeriksa koneksi AI…</div><div class="divider"></div><button class="primary" onclick="checkAIHealth()">Periksa koneksi AI</button><button onclick="exportSave()">Ekspor save JSON</button><button onclick="document.getElementById('importSaveFile').click()">Impor save</button><input id="importSaveFile" type="file" accept=".json,application/json" class="hidden" onchange="importSave(event)"><button class="danger" onclick="resetGame()">Hapus save lokal</button>`);checkAIHealth()}
async function checkAIHealth(){const el=$('#aiHealth');if(!el)return;el.textContent='Memeriksa koneksi AI…';try{const r=await fetch('/api/health');const d=await r.json();if(!r.ok||!d.aiConfigured)throw new Error('API key belum diatur pada server');el.textContent=`AI terhubung · Model: ${d.model||'configured'}`}catch(e){el.textContent='AI belum siap. Jalankan server Hoshizora dan atur OPENAI_API_KEY di environment server. Game tidak akan menggunakan simulasi lokal.'}}
function exportSave(){const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hoshizora-save.json';a.click();URL.revokeObjectURL(a.href);toast('Save diekspor.')}
function importSave(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.player||!d.stats)throw new Error();game=d;save();closeModal();renderGame();toast('Save berhasil diimpor.')}catch(err){toast('File save tidak valid.')}};r.readAsText(f)}
function resetGame(){if(!confirm('Hapus save Hoshizora dari browser ini? Tindakan ini tidak dapat dibatalkan.'))return;localStorage.removeItem('hoshizora_save_v1');game=null;closeModal();renderStart();toast('Save lokal dihapus.')}
function showHelp(){openModal('❔ Panduan singkat',`<h3>Cara bermain</h3><ul><li>Pilih New Game dan buat karakter.</li><li>Gunakan Jelajahi untuk berpindah lokasi.</li><li>Gunakan Aktivitas untuk belajar, olahraga, dan beristirahat.</li><li>Sapa NPC untuk mulai mengenal mereka.</li><li>Tindakan bebas dan interaksi NPC diproses oleh AI. AI harus terhubung agar tindakan dapat dijalankan.</li><li>Waktu, energi, lapar, uang, dan statistik dapat berubah.</li><li>Tekan Save atau aktifkan autosave (aktif secara default).</li></ul><h3>AI</h3><p>AI selalu aktif dan wajib tersedia melalui backend. Tidak ada fallback simulasi lokal. Konfigurasikan OPENAI_API_KEY di server sebelum bermain.</p><button class="primary" onclick="closeModal()">Mengerti</button>`)}
// Date-aware school calendar starts on Monday, 6 April 2026.
if(load()&&game.player)renderStart();else renderStart();
